name: Back - Security

on:
  push:
    branches:
      - main
      - dev
     

  pull_request:
    branches:
      - main
      - dev

jobs:

  composer-audit:
    name: Audit des dépendances Composer
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          coverage: none

      - name: Installation des dépendances
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Création du dossier de rapports
        run: mkdir -p reports

      - name: Audit Composer - rapport texte
        run: composer audit > reports/composer-audit.txt 2>&1
        continue-on-error: true

      - name: Audit Composer - rapport JSON
        run: composer audit --format=json > reports/composer-audit.json
        continue-on-error: true

      - name: Sauvegarde du rapport des dépendances
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: composer-security-report
          path: reports/
          if-no-files-found: ignore


  secret-scan:
    name: Recherche de secrets
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}


  semgrep:
    name: Analyse Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Semgrep
        run: pip install semgrep

      - name: Scan Semgrep
        run: semgrep scan --config auto src