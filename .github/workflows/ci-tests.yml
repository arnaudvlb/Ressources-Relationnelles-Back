name: Back - Tests

on:
  push:
    branches:
      - main
      - dev
      - "**/**"

  pull_request:
    branches:
      - main
      - dev

jobs:
  tests:
    name: Tests PHPUnit
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4

        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: projetcollab_test
          MYSQL_USER: ressources
          MYSQL_PASSWORD: ressources

        ports:
          - 3306:3306

        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: test

      # On indique "projetcollab".
      # Symfony ajoute automatiquement "_test"
      # en environnement de test.
      DATABASE_URL: >-
        mysql://ressources:ressources@127.0.0.1:3306/projetcollab?serverVersion=8.4&charset=utf8mb4

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: intl, pdo_mysql, zip
          coverage: none

      - name: Installation des dépendances
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Exécution des migrations
        run: php bin/console doctrine:migrations:migrate --env=test --no-interaction

      - name: Chargement des fixtures
        run: php bin/console doctrine:fixtures:load --env=test --no-interaction

      - name: Tests PHPUnit
        run: php bin/phpunit