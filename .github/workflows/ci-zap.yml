name: Back - OWASP ZAP

on:
  push:
    branches:
      - main
      - dev

  pull_request:
    branches:
      - main
      - dev

jobs:
  zap-scan:
    name: Scan OWASP ZAP
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.5"
          extensions: intl, pdo_mysql, zip
          coverage: none

      - name: Installation des dépendances
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Démarrage de l'API
        run: |
          php -S 0.0.0.0:8000 -t public > /tmp/api.log 2>&1 &
          echo $! > api.pid

      - name: Attente du démarrage
        run: |
          for i in {1..30}; do
            if curl -sS http://127.0.0.1:8000/api > /dev/null 2>&1; then
              echo "API disponible"
              exit 0
            fi

            echo "Attente de l'API..."
            sleep 2
          done

          cat /tmp/api.log
          exit 1

      - name: Scan OWASP ZAP
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: "http://127.0.0.1:8000/api"
          allow_issue_writing: false
          fail_action: true